<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>COSM</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:#080810;overflow:hidden;font-family:'Courier New',monospace;color:#aaccff;}
  canvas{display:block;cursor:crosshair;}

  #barra-destino{
    position:fixed;top:20px;left:50%;transform:translateX(-50%);
    display:flex;align-items:center;gap:8px;z-index:10;
    background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.1);
    border-radius:8px;padding:8px 14px;pointer-events:all;
    backdrop-filter:blur(6px);
  }
  #coord-label{font-size:10px;letter-spacing:4px;color:rgba(255,255,255,0.25);}
  #coord-input{
    background:transparent;border:none;outline:none;
    color:rgba(255,255,255,0.75);font-family:'Courier New',monospace;
    font-size:13px;letter-spacing:2px;width:170px;
  }
  #coord-input::placeholder{color:rgba(255,255,255,0.18);}
  #btn-ir{
    background:transparent;border:1px solid rgba(255,255,255,0.18);
    border-radius:5px;color:rgba(255,255,255,0.5);cursor:pointer;
    font-family:'Courier New',monospace;font-size:10px;
    letter-spacing:3px;padding:4px 12px;transition:all 0.2s;
  }
  #btn-ir:hover{border-color:rgba(255,255,255,0.45);color:#fff;}

  #hud-bottom{
    position:fixed;bottom:20px;left:0;right:0;
    display:flex;justify-content:space-between;
    padding:0 24px;pointer-events:none;z-index:10;
  }
  .painel{
    background:rgba(0,0,0,0.5);border:1px solid rgba(255,255,255,0.07);
    border-radius:8px;padding:10px 16px;
  }
  .painel-label{font-size:9px;letter-spacing:4px;color:rgba(255,255,255,0.22);margin-bottom:5px;}
  .painel-valor{font-size:13px;color:rgba(255,255,255,0.65);letter-spacing:1px;}

  #notif{
    position:fixed;top:68px;left:50%;transform:translateX(-50%);
    font-size:10px;letter-spacing:3px;color:rgba(255,255,255,0.35);
    pointer-events:none;z-index:20;opacity:0;transition:opacity 0.4s;white-space:nowrap;
  }
  #prox-overlay{
    position:fixed;inset:0;pointer-events:none;z-index:5;
    background:radial-gradient(ellipse at center,
      transparent 20%, rgba(0,40,160,0.22) 60%, rgba(0,80,255,0.55) 100%);
    opacity:0;transition:opacity 0.15s;
  }
  #flash{
    position:fixed;inset:0;pointer-events:none;z-index:50;
    background:#ffffff;opacity:0;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="barra-destino">
  <span id="coord-label">COSM://</span>
  <input id="coord-input" type="text" placeholder="X : Y : Z" spellcheck="false"/>
  <button id="btn-ir" onclick="irParaCoordenada()">IR</button>
</div>

<div id="hud-bottom">
  <div class="painel">
    <div class="painel-label">COORDENADA ATUAL</div>
    <div id="txt-pos" class="painel-valor">0 : 0 : 0</div>
  </div>
  <div class="painel">
    <div class="painel-label">VELOCIDADE</div>
    <div id="txt-vel" class="painel-valor">0 —</div>
  </div>
</div>

<div id="notif"></div>
<div id="prox-overlay"></div>
<div id="flash"></div>

<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}</script>
<script type="module">
import * as THREE from 'three';

// ═══════════════════════════════════════════════════════
//  RENDERER
// ═══════════════════════════════════════════════════════
const canvas   = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({canvas, antialias:true});
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));

const scene  = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(60, innerWidth/innerHeight, 0.1, 100000000);
const clock  = new THREE.Clock();

camera.position.set(0, 0, 1800); // começa 1800 unidades do centro (0:0:0)

window.addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// ═══════════════════════════════════════════════════════
//  ESTRELAS — 5 camadas para paralaxe em múltiplas escalas
// ═══════════════════════════════════════════════════════
function gerarEstrelas(qtd, raioMin, raioMax, tamanho, opacidade) {
  const pos = new Float32Array(qtd * 3);
  for (let i = 0; i < qtd; i++) {
    const theta = Math.random() * Math.PI * 2;
    const phi   = Math.acos(2 * Math.random() - 1);
    const r     = raioMin + (raioMax - raioMin) * Math.random();
    pos[i*3]   = r * Math.sin(phi) * Math.cos(theta);
    pos[i*3+1] = r * Math.sin(phi) * Math.sin(theta);
    pos[i*3+2] = r * Math.cos(phi);
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  return new THREE.Points(geo, new THREE.PointsMaterial({
    color: 0xffffff, size: tamanho,
    sizeAttenuation: false, transparent: true, opacity: opacidade
  }));
}

const camadas = [
  gerarEstrelas(7000,  2e6,   80e6,  1.0, 0.55),
  gerarEstrelas(2000,  500e3, 2e6,   0.8, 0.35),
  gerarEstrelas(1200,  20e3,  500e3, 1.1, 0.60),
  gerarEstrelas(600,   2000,  20e3,  1.4, 0.70),
  gerarEstrelas(150,   400,   2000,  1.8, 0.80),
];
camadas.forEach(c => scene.add(c));

// ═══════════════════════════════════════════════════════
//  WORMHOLE — fixo em COSM 0:0:0
// ═══════════════════════════════════════════════════════
const WORMHOLE_VS = `
  varying vec3 vNormal;
  varying vec3 vWorldPos;
  varying vec2 vUv;
  void main() {
    vUv       = uv;
    vNormal   = normalize(normalMatrix * normal);
    vWorldPos = (modelMatrix * vec4(position, 1.0)).xyz;
    gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
  }
`;

const WORMHOLE_FS = `
  varying vec3 vNormal;
  varying vec3 vWorldPos;
  varying vec2 vUv;
  uniform float uTime;
  uniform vec3  uCamPos;
  uniform float uProx;

  float hash2(vec2 p) {
    p = fract(p * vec2(234.34, 435.345));
    p += dot(p, p + 34.23);
    return fract(p.x * p.y);
  }
  float noise2(vec2 p) {
    vec2 i = floor(p), f = fract(p);
    f = f * f * (3.0 - 2.0 * f);
    return mix(
      mix(hash2(i), hash2(i + vec2(1,0)), f.x),
      mix(hash2(i + vec2(0,1)), hash2(i + vec2(1,1)), f.x), f.y);
  }

  void main() {
    vec3  viewDir = normalize(uCamPos - vWorldPos);
    float fr      = 1.0 - max(0.0, dot(vNormal, viewDir));
    float fr2     = fr * fr;
    float fr4     = fr2 * fr2;

    // == GALAXIA INTERIOR ==
    vec3  n     = normalize(vNormal);
    float theta = atan(n.z, n.x) + uTime * 0.04;
    float rGal  = length(n.xz);

    float nA = noise2(vec2(theta * 2.5 + rGal * 10.0, rGal * 4.0) + uTime * 0.02);
    float nB = noise2(vec2(theta * 4.0 - rGal * 6.0,  rGal * 3.0) - uTime * 0.015);
    float nC = noise2(vec2(theta * 1.2 + rGal * 14.0, rGal * 5.0) + uTime * 0.008);

    float core = exp(-rGal * 5.5);

    // Estrelas pontuais da outra galáxia
    float starSeed   = hash2(floor(n.xz * 130.0));
    float starMask   = step(0.965, starSeed);
    float starBright = hash2(floor(n.xz * 55.0 + 7.3)) * 0.6 + 0.4;

    vec3 cCore   = vec3(1.00, 0.82, 0.35);  // amarelo-laranja
    vec3 cArm1   = vec3(0.80, 0.22, 0.90);  // roxo
    vec3 cArm2   = vec3(0.20, 0.42, 1.00);  // azul
    vec3 cNebula = vec3(0.95, 0.38, 0.12);  // laranja nebulosa
    vec3 cDark   = vec3(0.02, 0.01, 0.08);

    vec3 arms = mix(cArm2, cArm1, nA);
    arms = mix(arms, cNebula, nB * 0.45);
    arms = mix(arms, cArm1 * 1.2, nC * 0.3);
    vec3 galaxy = mix(cDark, arms, smoothstep(0.0, 0.65, nA * 0.55 + nB * 0.35 + nC * 0.1));
    galaxy = mix(galaxy, cCore, core * 0.65);
    galaxy += cCore * core * 1.9;
    galaxy += vec3(1.0, 0.97, 0.90) * starMask * starBright * 2.5;
    galaxy *= 1.6;

    // Galáxia visível no centro, some suavemente na borda
    float interiorMask = smoothstep(0.58, 0.0, fr);
    vec3  interior     = galaxy * interiorMask;

    // == EINSTEIN RING ==
    float ringSharp = smoothstep(0.70, 0.80, fr) * smoothstep(1.00, 0.83, fr);
    float ringBroad = pow(fr, 5.0);

    // Cor do anel intensifica com proximidade (branco -> azul-violeta)
    vec3 rCol = mix(vec3(0.90, 0.95, 1.00), vec3(0.55, 0.65, 1.00), uProx);
    vec3 ring = rCol * ringSharp * (10.0 + uProx * 18.0)
              + vec3(0.40, 0.62, 1.00) * ringBroad * (1.8 + uProx * 2.5);

    // Pulso no anel quando perto
    float pulse = sin(uTime * 3.0) * 0.5 + 0.5;
    ring += rCol * ringSharp * pulse * uProx * 8.0;

    // Glow azul na borda ao aproximar
    vec3 proxGlow = vec3(0.25, 0.55, 1.00) * fr4 * uProx * 5.0;

    vec3  color = interior + ring + proxGlow;
    float alpha = interiorMask * 0.97
                + ringSharp * 1.0
                + ringBroad * 0.65
                + fr4 * (0.15 + uProx * 0.5);

    gl_FragColor = vec4(color, clamp(alpha, 0.0, 1.0));
  }
`;

const wMat = new THREE.ShaderMaterial({
  vertexShader:   WORMHOLE_VS,
  fragmentShader: WORMHOLE_FS,
  uniforms: { uTime: {value:0}, uCamPos: {value: new THREE.Vector3()}, uProx: {value:0} },
  transparent: true, side: THREE.FrontSide, depthWrite: false
});

function criarAnelParticulas(raio, espessura, qtd, incX, incZ, cor, tam, opa) {
  const pos = new Float32Array(qtd * 3);
  for (let i = 0; i < qtd; i++) {
    const t = Math.random() * Math.PI * 2;
    const r = raio + (Math.random() - 0.5) * espessura;
    const h = (Math.random() - 0.5) * espessura * 0.18;
    pos[i*3] = r * Math.cos(t); pos[i*3+1] = h; pos[i*3+2] = r * Math.sin(t);
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  const pts = new THREE.Points(geo, new THREE.PointsMaterial({
    color: cor, size: tam, sizeAttenuation: true,
    transparent: true, opacity: opa,
    blending: THREE.AdditiveBlending, depthWrite: false
  }));
  pts.rotation.x = incX;
  pts.rotation.z = incZ;
  return pts;
}

const wormholeGroup    = new THREE.Group();
const wormholeSphere   = new THREE.Mesh(new THREE.SphereGeometry(150, 96, 96), wMat);
const anelEquatorial   = criarAnelParticulas(230, 55, 10000, Math.PI*0.07, 0,    0xaaddff, 1.8, 0.55);
const anelInclinado    = criarAnelParticulas(200, 40,  5000, Math.PI*0.42, 0.15, 0x88bbff, 1.4, 0.40);
const anelExterno      = criarAnelParticulas(320, 90,  3000, Math.PI*0.03, 0,    0xffffff, 1.0, 0.18);
const wormholeGlow     = new THREE.Mesh(
  new THREE.SphereGeometry(260, 32, 32),
  new THREE.ShaderMaterial({
    vertexShader:   `varying vec3 vN; void main(){ vN=normalize(normalMatrix*normal); gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
    fragmentShader: `varying vec3 vN; uniform vec3 uCamDir; void main(){ float g=pow(1.0-abs(dot(vN,normalize(uCamDir))),2.5)*0.45; gl_FragColor=vec4(0.45,0.65,1.0,g); }`,
    uniforms: { uCamDir: {value: new THREE.Vector3(0,0,1)} },
    transparent: true, side: THREE.BackSide,
    blending: THREE.AdditiveBlending, depthWrite: false
  })
);

wormholeGroup.add(wormholeSphere, anelEquatorial, anelInclinado, anelExterno, wormholeGlow);
scene.add(wormholeGroup);

// ═══════════════════════════════════════════════════════
//  COORDENADAS — floating origin
//  COSM(x,y,z) = coordBase + camera.position
//  0:0:0 = centro do universo
// ═══════════════════════════════════════════════════════
const coordBase = {x:0, y:0, z:0};

function formatCoord(v) {
  const s = v < 0 ? '-' : '';
  const a = Math.abs(v);
  if (a >= 1e12) return s + (a/1e12).toFixed(2) + 'T';
  if (a >= 1e9)  return s + (a/1e9 ).toFixed(2) + 'G';
  if (a >= 1e6)  return s + (a/1e6 ).toFixed(2) + 'M';
  if (a >= 1e3)  return s + (a/1e3 ).toFixed(2) + 'k';
  return s + Math.round(a);
}

function coordAtual() {
  return {
    x: coordBase.x + camera.position.x,
    y: coordBase.y + camera.position.y,
    z: coordBase.z + camera.position.z
  };
}

// ═══════════════════════════════════════════════════════
//  ESTADO DE NAVEGAÇÃO
// ═══════════════════════════════════════════════════════
const VEL_MAX   = 1200;
let velCruz     = 0;
let voando          = false;
let alvoVoo         = null;
let alvoVooRotacao  = null;
let arrastando  = false;
let mouseMoved  = false;
let lastX       = 0, lastY = 0;
const teclas = {};

// Quaternion helpers — reutilizados sem alloc por frame
const _qRot = new THREE.Quaternion();
const _axY  = new THREE.Vector3(0, 1, 0);
const _axX  = new THREE.Vector3(1, 0, 0);
const _fwd  = new THREE.Vector3();

const proxOverlay = document.getElementById('prox-overlay');
const flashEl     = document.getElementById('flash');
let ejetando      = false;
let warnedHorizon = false;

// ═══════════════════════════════════════════════════════
//  EVENTOS DE ENTRADA
// ═══════════════════════════════════════════════════════
canvas.addEventListener('mousedown', e => {
  if (e.button !== 0) return;
  arrastando = true; mouseMoved = false;
  lastX = e.clientX; lastY = e.clientY;
  canvas.style.cursor = 'grabbing';
});

canvas.addEventListener('mousemove', e => {
  if (!arrastando) return;
  const dx = e.clientX - lastX;
  const dy = e.clientY - lastY;
  if (Math.abs(dx) + Math.abs(dy) > 2) mouseMoved = true;
  lastX = e.clientX; lastY = e.clientY;
  // Yaw: eixo Y MUNDIAL — esq/dir sem roll independente da orientação
  _qRot.setFromAxisAngle(_axY, -dx * 0.003);
  camera.quaternion.premultiply(_qRot);
  // Pitch: eixo X LOCAL da câmera — cima/baixo 360° sem trava
  _qRot.setFromAxisAngle(_axX, -dy * 0.003);
  camera.quaternion.multiply(_qRot);
  camera.quaternion.normalize();
});

canvas.addEventListener('mouseup', () => {
  arrastando = false;
  canvas.style.cursor = 'crosshair';
});

canvas.addEventListener('contextmenu', e => e.preventDefault());

document.addEventListener('wheel', e => {
  e.preventDefault();
  velCruz = Math.max(-VEL_MAX, Math.min(VEL_MAX, velCruz - e.deltaY * 0.6));
}, {passive: false});

document.addEventListener('keydown', e => {
  teclas[e.code] = true;
  if (e.code === 'Escape') { velCruz = 0; voando = false; alvoVoo = null; }
});
document.addEventListener('keyup', e => delete teclas[e.code]);

document.getElementById('coord-input').addEventListener('keydown', e => {
  if (e.key === 'Enter') irParaCoordenada();
});

// ═══════════════════════════════════════════════════════
//  TELETRANSPORTE — instantâneo com efeito de warp
// ═══════════════════════════════════════════════════════
let warping = false;

window.irParaCoordenada = function() {
  const val    = document.getElementById('coord-input').value.trim();
  const partes = val.split(':').map(v => parseFloat(v.trim()));
  if (partes.length !== 3 || partes.some(isNaN)) {
    const inp = document.getElementById('coord-input');
    inp.style.color = 'rgba(255,80,80,0.9)';
    setTimeout(() => inp.style.color = '', 800);
    return;
  }
  if (warping || ejetando) return;
  const [cx, cy, cz] = partes;

  velCruz = 0; voando = false; alvoVoo = null; alvoVooRotacao = null;
  warping = true;

  // Warp entrada: canvas estica e brilha
  canvas.style.transition = 'filter 0.22s';
  canvas.style.filter = 'blur(10px) brightness(3.5) saturate(5)';
  flashEl.style.background = 'radial-gradient(ellipse at center, #aaddff 0%, #0011aa 55%, #000011 100%)';
  flashEl.style.transition = 'opacity 0.20s';
  flashEl.style.opacity = '0.92';
  notif(`SALTANDO → ${formatCoord(cx)} : ${formatCoord(cy)} : ${formatCoord(cz)}`);

  setTimeout(() => {
    // Teleporte instantâneo: reposiciona coordBase, câmera chega a 1800u do destino
    const fwd     = new THREE.Vector3(0, 0, -1).applyQuaternion(camera.quaternion);
    const chegada = fwd.clone().multiplyScalar(-1800); // 1800u oposto ao olhar

    coordBase.x = cx; coordBase.y = cy; coordBase.z = cz;
    camera.position.copy(chegada);

    // Orienta câmera para o destino (Three.js origin = coordenada destino)
    const mx = new THREE.Matrix4().lookAt(chegada, new THREE.Vector3(0,0,0), new THREE.Vector3(0,1,0));
    camera.quaternion.setFromRotationMatrix(mx);

    // Warp saída: fade suave de volta ao espaço
    canvas.style.transition = 'filter 0.75s';
    canvas.style.filter = '';
    flashEl.style.transition = 'opacity 0.60s';
    flashEl.style.opacity = '0';
    flashEl.style.background = '#ffffff';
    setTimeout(() => { warping = false; }, 800);
  }, 240);
};

// ═══════════════════════════════════════════════════════
//  NOTIFICAÇÃO
// ═══════════════════════════════════════════════════════
let notifTimer = null;
function notif(msg) {
  const el = document.getElementById('notif');
  el.textContent = msg; el.style.opacity = '1';
  clearTimeout(notifTimer);
  notifTimer = setTimeout(() => el.style.opacity = '0', 2800);
}

// ═══════════════════════════════════════════════════════
//  HUD
// ═══════════════════════════════════════════════════════
let hudTimer = null;
function atualizarHUD() {
  if (!hudTimer) {
    hudTimer = setTimeout(() => {
      const c = coordAtual();
      document.getElementById('txt-pos').textContent =
        `${formatCoord(c.x)} : ${formatCoord(c.y)} : ${formatCoord(c.z)}`;
      hudTimer = null;
    }, 80);
  }
  const v = Math.abs(Math.round(velCruz));
  document.getElementById('txt-vel').textContent =
    v + (velCruz < -1 ? ' ◀' : velCruz > 1 ? ' ▶' : ' —');
}

// ═══════════════════════════════════════════════════════
//  LOOP PRINCIPAL
// ═══════════════════════════════════════════════════════
function loop() {
  requestAnimationFrame(loop);

  // Voo de teletransporte
  if (voando && alvoVoo) {
    const dist = camera.position.distanceTo(alvoVoo);
    if (dist < 60) {
      voando = false; alvoVoo = null; alvoVooRotacao = null;
    } else {
      camera.position.addScaledVector(
        alvoVoo.clone().sub(camera.position).normalize(),
        Math.min(dist * 0.07, VEL_MAX)
      );
      // Gira câmera suavemente para olhar para o destino durante o voo
      if (alvoVooRotacao) {
        camera.quaternion.slerp(alvoVooRotacao, 0.06);
      }
    }
  }

  // Cruzeiro — scroll acumula velocidade, decai com atrito
  if (!voando && Math.abs(velCruz) > 0.5) {
    _fwd.set(0, 0, -1).applyQuaternion(camera.quaternion);
    camera.position.addScaledVector(_fwd, velCruz);
    velCruz *= 0.96;
  }

  // WASD — movimento na direção atual da câmera
  if (!voando) {
    const spd = teclas['ShiftLeft'] ? 200 : 60;
    const dir = new THREE.Vector3();
    if (teclas['KeyW'] || teclas['ArrowUp'])    dir.z -= 1;
    if (teclas['KeyS'] || teclas['ArrowDown'])  dir.z += 1;
    if (teclas['KeyA'] || teclas['ArrowLeft'])  dir.x -= 1;
    if (teclas['KeyD'] || teclas['ArrowRight']) dir.x += 1;
    if (teclas['KeyQ']) dir.y += 1;
    if (teclas['KeyE']) dir.y -= 1;
    if (dir.lengthSq() > 0) {
      dir.normalize().applyQuaternion(camera.quaternion);
      camera.position.addScaledVector(dir, spd);
    }
  }

  // Estrelas seguem a câmera — sem aglomeração em nenhum ponto do espaço
  camadas.forEach(c => c.position.copy(camera.position));

  // Wormhole — reposiciona para manter em COSM 0:0:0
  const t = clock.getElapsedTime();
  wormholeGroup.position.set(-coordBase.x, -coordBase.y, -coordBase.z);
  wMat.uniforms.uTime.value = t;
  wMat.uniforms.uCamPos.value.copy(camera.position);
  anelEquatorial.rotation.y =  t * 0.08;
  anelInclinado.rotation.y  = -t * 0.055;

  // Proximidade ao wormhole — campo gravitacional
  if (!ejetando && !warping) {
    const distWH = camera.position.distanceTo(wormholeGroup.position);
    const ZONA   = 1400;
    const RAIO   = 150;
    const prox   = Math.max(0, 1 - Math.max(0, distWH - RAIO) / (ZONA - RAIO));

    wMat.uniforms.uProx.value = prox;

    if (prox > 0.02) {
      const p2 = prox * prox;
      canvas.style.filter = `blur(${p2 * 5}px) saturate(${1 + prox * 2}) hue-rotate(${prox * 25}deg)`;
      proxOverlay.style.opacity = Math.pow(prox, 1.5) * 0.85;
      if (prox > 0.88 && !warnedHorizon) {
        warnedHorizon = true;
        notif('HORIZONTE DE EVENTOS DETECTADO');
      }
    } else {
      canvas.style.filter = '';
      proxOverlay.style.opacity = 0;
      warnedHorizon = false;
    }

    // Ejeção — atravessa o buraco de minhoca
    if (distWH < RAIO + 5 && !voando) {
      ejetando = true;
      velCruz = 0; alvoVoo = null;
      flashEl.style.transition = 'opacity 0.18s';
      flashEl.style.opacity = '1';
      setTimeout(() => {
        const mag = 5e7 + Math.random() * 4e8;
        const nx  = (Math.random() - 0.5) * 2 * mag;
        const ny  = (Math.random() - 0.5) * 0.5 * mag;
        const nz  = (Math.random() - 0.5) * 2 * mag;
        coordBase.x = nx; coordBase.y = ny; coordBase.z = nz;
        camera.position.set(0, 0, 1800);
        camera.quaternion.set(
          Math.random()-0.5, Math.random()-0.5, Math.random()-0.5, Math.random()
        ).normalize();
        canvas.style.filter = '';
        proxOverlay.style.opacity = 0;
        wMat.uniforms.uProx.value = 0;
        flashEl.style.transition = 'opacity 1.4s';
        flashEl.style.opacity = '0';
        notif(`UNIVERSO PARALELO — ${formatCoord(nx)} : ${formatCoord(ny)} : ${formatCoord(nz)}`);
        setTimeout(() => { ejetando = false; warnedHorizon = false; }, 2500);
      }, 420);
    }
  }

  atualizarHUD();
  renderer.render(scene, camera);
}

loop();
</script>
</body>
</html>
