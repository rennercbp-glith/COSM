<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>COSM</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:#080810;overflow:hidden;font-family:'Courier New',monospace;color:#aaccff;}
  canvas{display:block;cursor:crosshair;}

  /* ── DESTINO ──────────────────────────────────── */
  #barra-destino{
    position:fixed;top:20px;left:50%;transform:translateX(-50%);
    display:flex;align-items:center;gap:8px;z-index:10;
    background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.1);
    border-radius:8px;padding:8px 14px;pointer-events:all;
    backdrop-filter:blur(6px);
  }
  #coord-label{
    font-size:10px;letter-spacing:4px;color:rgba(255,255,255,0.25);
  }
  #coord-input{
    background:transparent;border:none;outline:none;
    color:rgba(255,255,255,0.75);font-family:'Courier New',monospace;
    font-size:13px;letter-spacing:2px;width:170px;
    transition:border-color 0.2s;
  }
  #coord-input::placeholder{color:rgba(255,255,255,0.18);}
  #btn-ir{
    background:transparent;border:1px solid rgba(255,255,255,0.18);
    border-radius:5px;color:rgba(255,255,255,0.5);cursor:pointer;
    font-family:'Courier New',monospace;font-size:10px;
    letter-spacing:3px;padding:4px 12px;pointer-events:all;
    transition:all 0.2s;
  }
  #btn-ir:hover{border-color:rgba(255,255,255,0.45);color:#fff;}

  /* ── PAINÉIS INFERIORES ───────────────────────── */
  #hud-bottom{
    position:fixed;bottom:20px;left:0;right:0;
    display:flex;justify-content:space-between;
    padding:0 24px;pointer-events:none;z-index:10;
  }
  .painel{
    background:rgba(0,0,0,0.5);border:1px solid rgba(255,255,255,0.07);
    border-radius:8px;padding:10px 16px;
  }
  .painel-label{
    font-size:9px;letter-spacing:4px;color:rgba(255,255,255,0.22);
    margin-bottom:5px;
  }
  .painel-valor{
    font-size:13px;color:rgba(255,255,255,0.65);letter-spacing:1px;
  }

  /* ── NOTIFICAÇÃO ──────────────────────────────── */
  #notif{
    position:fixed;top:68px;left:50%;transform:translateX(-50%);
    font-size:10px;letter-spacing:3px;color:rgba(255,255,255,0.35);
    pointer-events:none;z-index:20;opacity:0;transition:opacity 0.4s;
    white-space:nowrap;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>

<!-- Destino -->
<div id="barra-destino">
  <span id="coord-label">COSM://</span>
  <input id="coord-input" type="text" placeholder="X : Y : Z" spellcheck="false"/>
  <button id="btn-ir" onclick="irParaCoordenada()">IR</button>
</div>

<!-- HUD inferior -->
<div id="hud-bottom">
  <div class="painel">
    <div class="painel-label">COORDENADA ATUAL</div>
    <div id="txt-pos" class="painel-valor">0 : 0 : 0</div>
  </div>
  <div class="painel">
    <div class="painel-label">VELOCIDADE</div>
    <div id="txt-vel" class="painel-valor">0 —</div>
  </div>
</div>

<div id="notif"></div>

<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}</script>
<script type="module">
import * as THREE from 'three';

// ═══════════════════════════════════════════════════════
//  RENDERER
// ═══════════════════════════════════════════════════════
const canvas=document.getElementById('c');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,2));

const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(60,innerWidth/innerHeight,0.1,100000000);
camera.rotation.order='YXZ';
camera.position.set(0,0,1800);
const clock=new THREE.Clock();

window.addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});

// ═══════════════════════════════════════════════════════
//  ESTRELAS — três camadas de profundidade
// ═══════════════════════════════════════════════════════
function gerarEstrelas(qtd, raioMin, raioMax, tamanho, opacidade){
  const geo=new THREE.BufferGeometry();
  const pos=new Float32Array(qtd*3);
  for(let i=0;i<qtd;i++){
    const theta=Math.random()*Math.PI*2;
    const phi=Math.acos(2*Math.random()-1);
    const r=raioMin+(raioMax-raioMin)*Math.random();
    pos[i*3]  =r*Math.sin(phi)*Math.cos(theta);
    pos[i*3+1]=r*Math.sin(phi)*Math.sin(theta);
    pos[i*3+2]=r*Math.cos(phi);
  }
  geo.setAttribute('position',new THREE.BufferAttribute(pos,3));
  const mat=new THREE.PointsMaterial({
    color:0xffffff,size:tamanho,
    sizeAttenuation:false,transparent:true,opacity:opacidade
  });
  return new THREE.Points(geo,mat);
}
scene.add(gerarEstrelas(7000, 2e6,  80e6, 1.0, 0.55));
scene.add(gerarEstrelas(2000, 500e3, 2e6,  0.8, 0.35));
scene.add(gerarEstrelas(400,  50e3,  500e3, 1.2, 0.65));

// ═══════════════════════════════════════════════════════
//  WORMHOLE — COSM://0:0:0
// ═══════════════════════════════════════════════════════
const wormholeGroup=new THREE.Group();
scene.add(wormholeGroup);

const wVS=`
varying vec3 vNormal;
varying vec3 vWorldPos;
varying vec2 vUv;
void main(){
  vUv=uv;
  vNormal=normalize(normalMatrix*normal);
  vWorldPos=(modelMatrix*vec4(position,1.0)).xyz;
  gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);
}`;

const wFS=`
varying vec3 vNormal;
varying vec3 vWorldPos;
varying vec2 vUv;
uniform float uTime;
uniform vec3 uCamPos;

float hash(vec3 p){
  p=fract(p*vec3(443.8975,397.2973,491.1871));
  p+=dot(p.zxy,p.yxz+19.19);
  return fract(p.x*p.y*p.z);
}
float estrelas(vec3 d){
  float s=0.0;
  for(float i=1.0;i<=4.0;i++){
    float sc=60.0*i;
    vec3 id=floor(d*sc);
    vec3 fr=fract(d*sc)-0.5;
    float h=hash(id);
    s+=smoothstep(0.05-h*0.03,0.0,length(fr))*(h*0.8+0.2);
  }
  return s;
}

void main(){
  vec3 viewDir=normalize(uCamPos-vWorldPos);
  float fr=1.0-max(0.0,dot(vNormal,viewDir));
  float fr2=pow(fr,2.0);
  float fr4=pow(fr,4.0);

  // Anel de lensing gravitacional — brilho intenso na borda
  float ringSharp=smoothstep(0.68,0.80,fr)*smoothstep(1.0,0.86,fr);
  float ringBroad=pow(fr4,0.5)*0.6;

  // Centro escuro — horizonte de eventos
  vec3 refDir=reflect(-viewDir,vNormal);
  float outerStars=estrelas(normalize(refDir+vec3(0.5,0.2,0.8)))*0.8;
  vec3 outerColor=vec3(0.55,0.75,1.0)*outerStars*(1.0-fr2)*0.35;

  // Nebulosa interna
  float pulse=sin(uTime*0.25+fr*8.0)*0.5+0.5;
  vec3 nebula=mix(
    vec3(0.01,0.03,0.12),
    vec3(0.05,0.10,0.35),
    (1.0-fr2)*pulse*0.6
  )*(1.0-fr2)*0.9;

  // Anel branco-azulado
  vec3 ringColor=(vec3(0.75,0.88,1.0)*ringSharp*5.0)+(vec3(0.5,0.7,1.0)*ringBroad);

  // Iridescência — sutil arco-íris na borda
  float iri=sin(fr*14.0+uTime*0.35)*0.5+0.5;
  vec3 iridesc=vec3(
    sin(iri*3.14)*0.4,
    sin(iri*3.14+2.09)*0.35,
    sin(iri*3.14+4.18)*0.5
  )*fr4*2.0;

  vec3 color=nebula+outerColor+ringColor+iridesc;

  // Alpha sólido no centro, difuso nas bordas
  float alpha=0.96*(1.0-smoothstep(0.0,0.15,fr));
  alpha+=ringSharp*0.9+ringBroad*0.7+fr4*0.5;
  alpha=min(1.0,alpha);

  gl_FragColor=vec4(color,alpha);
}`;

const wMat=new THREE.ShaderMaterial({
  vertexShader:wVS, fragmentShader:wFS,
  uniforms:{ uTime:{value:0}, uCamPos:{value:new THREE.Vector3()} },
  transparent:true, side:THREE.FrontSide, depthWrite:false
});
wormholeGroup.add(new THREE.Mesh(new THREE.SphereGeometry(150,96,96),wMat));

// Partículas dos anéis
function anel(raio,esp,qtd,incX,incZ,cor,tam,opa){
  const geo=new THREE.BufferGeometry();
  const pos=new Float32Array(qtd*3);
  for(let i=0;i<qtd;i++){
    const t=Math.random()*Math.PI*2;
    const r=raio+(Math.random()-.5)*esp;
    const h=(Math.random()-.5)*esp*0.18;
    pos[i*3]=r*Math.cos(t); pos[i*3+1]=h; pos[i*3+2]=r*Math.sin(t);
  }
  geo.setAttribute('position',new THREE.BufferAttribute(pos,3));
  const pts=new THREE.Points(geo,new THREE.PointsMaterial({
    color:cor,size:tam,sizeAttenuation:true,
    transparent:true,opacity:opa,
    blending:THREE.AdditiveBlending,depthWrite:false
  }));
  pts.rotation.x=incX; pts.rotation.z=incZ;
  return pts;
}
wormholeGroup.add(anel(230,55,10000,Math.PI*0.07,0,     0xaaddff,1.8,0.55)); // equatorial
wormholeGroup.add(anel(200,40, 5000,Math.PI*0.42,0.15,  0x88bbff,1.4,0.40)); // inclinado
wormholeGroup.add(anel(320,90, 3000,Math.PI*0.03,0,     0xffffff,1.0,0.18)); // externo tênue

// Glow externo (esfera invertida)
wormholeGroup.add(new THREE.Mesh(
  new THREE.SphereGeometry(260,32,32),
  new THREE.ShaderMaterial({
    vertexShader:`varying vec3 vN; void main(){ vN=normalize(normalMatrix*normal); gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
    fragmentShader:`varying vec3 vN; void main(){ float g=pow(1.0-abs(vN.z),2.5)*0.45; gl_FragColor=vec4(0.45,0.65,1.0,g); }`,
    transparent:true, side:THREE.BackSide,
    blending:THREE.AdditiveBlending, depthWrite:false
  })
));

// ═══════════════════════════════════════════════════════
//  COORDENADAS — floating origin
//  COSM(X,Y,Z) = coordBase + camera.position
//  0:0:0 = centro do universo
// ═══════════════════════════════════════════════════════
const coordBase={x:0,y:0,z:0};

function formatCoord(v){
  const neg=v<0; const a=Math.abs(v);
  const s=neg?'-':'';
  if(a>=1e12) return s+(a/1e12).toFixed(2)+'T';
  if(a>=1e9)  return s+(a/1e9 ).toFixed(2)+'G';
  if(a>=1e6)  return s+(a/1e6 ).toFixed(2)+'M';
  if(a>=1e3)  return s+(a/1e3 ).toFixed(2)+'k';
  return s+Math.round(a)+'';
}

function coordAtual(){
  const p=camera.position;
  return {
    x: coordBase.x+p.x,
    y: coordBase.y+p.y,
    z: coordBase.z+p.z
  };
}

// ═══════════════════════════════════════════════════════
//  NAVEGAÇÃO
// ═══════════════════════════════════════════════════════
const VEL_MAX=1200;
let velCruz=0;
let voando=false, alvoVoo=null;
let arrastando=false, mouseMoved=false, lastX=0, lastY=0;
const teclas={};

canvas.addEventListener('mousedown',e=>{
  if(e.button!==0) return;
  arrastando=true; mouseMoved=false;
  lastX=e.clientX; lastY=e.clientY;
  canvas.style.cursor='grabbing';
});

canvas.addEventListener('mousemove',e=>{
  if(!arrastando) return;
  const dx=e.clientX-lastX, dy=e.clientY-lastY;
  if(Math.abs(dx)+Math.abs(dy)>2) mouseMoved=true;
  lastX=e.clientX; lastY=e.clientY;
  camera.rotation.order='YXZ';
  camera.rotation.y-=dx*0.003;
  camera.rotation.x-=dy*0.003;
  camera.rotation.x=Math.max(-Math.PI/2,Math.min(Math.PI/2,camera.rotation.x));
});

canvas.addEventListener('mouseup',()=>{
  arrastando=false;
  canvas.style.cursor='crosshair';
});

canvas.addEventListener('contextmenu',e=>e.preventDefault());

document.addEventListener('wheel',e=>{
  e.preventDefault();
  velCruz=Math.max(-VEL_MAX,Math.min(VEL_MAX,velCruz-e.deltaY*0.6));
},{passive:false});

document.addEventListener('keydown',e=>{
  teclas[e.code]=true;
  if(e.code==='Escape'){ velCruz=0; voando=false; alvoVoo=null; }
});
document.addEventListener('keyup',e=>delete teclas[e.code]);

document.getElementById('coord-input').addEventListener('keydown',e=>{
  if(e.key==='Enter') irParaCoordenada();
});

// ═══════════════════════════════════════════════════════
//  TELETRANSPORTE
// ═══════════════════════════════════════════════════════
window.irParaCoordenada=function(){
  const val=document.getElementById('coord-input').value.trim();
  const partes=val.split(':').map(v=>parseFloat(v.trim()));
  if(partes.length!==3||partes.some(isNaN)){
    const inp=document.getElementById('coord-input');
    inp.style.color='rgba(255,80,80,0.9)';
    setTimeout(()=>inp.style.color='',800);
    return;
  }
  const [cx,cy,cz]=partes;
  // Reajusta floating origin — câmera permanece perto de (0,0,0) do Three.js
  coordBase.x=cx-camera.position.x;
  coordBase.y=cy-camera.position.y;
  coordBase.z=cz-camera.position.z;
  // Salto curto para dar sensação de movimento
  const fwd=new THREE.Vector3(0,0,-1).applyQuaternion(camera.quaternion);
  alvoVoo=camera.position.clone().addScaledVector(fwd,400);
  voando=true; velCruz=0;
  notif(`SALTANDO → ${formatCoord(cx)} : ${formatCoord(cy)} : ${formatCoord(cz)}`);
};

// ═══════════════════════════════════════════════════════
//  NOTIFICAÇÃO
// ═══════════════════════════════════════════════════════
let notifTimer=null;
function notif(msg){
  const el=document.getElementById('notif');
  el.textContent=msg; el.style.opacity='1';
  clearTimeout(notifTimer);
  notifTimer=setTimeout(()=>el.style.opacity='0',2800);
}

// ═══════════════════════════════════════════════════════
//  HUD
// ═══════════════════════════════════════════════════════
let hudTimer=null;
function atualizarHUD(){
  if(!hudTimer){
    hudTimer=setTimeout(()=>{
      const c=coordAtual();
      document.getElementById('txt-pos').textContent=
        `${formatCoord(c.x)} : ${formatCoord(c.y)} : ${formatCoord(c.z)}`;
      hudTimer=null;
    },80);
  }
  const v=Math.abs(Math.round(velCruz));
  document.getElementById('txt-vel').textContent=
    v+(velCruz<-1?' ◀':velCruz>1?' ▶':' —');
}

// ═══════════════════════════════════════════════════════
//  LOOP
// ═══════════════════════════════════════════════════════
function loop(){
  requestAnimationFrame(loop);

  // Voo de teletransporte
  if(voando&&alvoVoo){
    const dist=camera.position.distanceTo(alvoVoo);
    if(dist<60){
      voando=false; alvoVoo=null;
    } else {
      camera.position.addScaledVector(
        alvoVoo.clone().sub(camera.position).normalize(),
        Math.min(dist*0.07,VEL_MAX)
      );
    }
  }

  // Cruzeiro (scroll)
  if(!voando&&Math.abs(velCruz)>0.5){
    camera.position.addScaledVector(
      new THREE.Vector3(0,0,-1).applyQuaternion(camera.quaternion),
      velCruz
    );
    velCruz*=0.96;
  }

  // WASD / setas
  if(!voando){
    const spd=teclas['ShiftLeft']?200:60;
    const dir=new THREE.Vector3();
    if(teclas['KeyW']||teclas['ArrowUp'])    dir.z-=1;
    if(teclas['KeyS']||teclas['ArrowDown'])  dir.z+=1;
    if(teclas['KeyA']||teclas['ArrowLeft'])  dir.x-=1;
    if(teclas['KeyD']||teclas['ArrowRight']) dir.x+=1;
    if(teclas['KeyQ'])                        dir.y+=1;
    if(teclas['KeyE'])                        dir.y-=1;
    if(dir.lengthSq()>0){
      dir.normalize().applyQuaternion(camera.quaternion);
      camera.position.addScaledVector(dir,spd);
    }
  }

  // Wormhole — sempre em COSM 0:0:0
  const t=clock.getElapsedTime();
  wormholeGroup.position.set(-coordBase.x,-coordBase.y,-coordBase.z);
  wMat.uniforms.uTime.value=t;
  wMat.uniforms.uCamPos.value.copy(camera.position);
  wormholeGroup.children[1].rotation.y=t*0.08;   // anel equatorial
  wormholeGroup.children[2].rotation.y=-t*0.055; // anel inclinado

  atualizarHUD();
  renderer.render(scene,camera);
}

loop();
</script>
</body>
</html>
